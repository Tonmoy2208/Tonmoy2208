<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Deploy pipeline: git push, GitHub Actions, SSH deploy, Docker Compose rebuild, health check">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl  { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .sub  { fill: #656d76; font-size: 11.5px; }
    .num  { fill: #656d76; font-size: 10.5px; letter-spacing: 1px; }
    .cap  { fill: #656d76; font-size: 12.5px; }
    .flow { stroke: #1a7f37; stroke-width: 1.6; stroke-dasharray: 4 5; fill: none; animation: flow 1.2s linear infinite; }
    .node { fill: #ffffff; stroke: #d0d7de; }
    .live { fill: #ffffff; stroke: #1a7f37; }
    .pulse { fill: #1a7f37; animation: pulse 2s ease-in-out infinite; }
    @keyframes flow  { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <text x="20" y="22" class="mono num">HOW A CHANGE REACHES PRODUCTION</text>

  <!-- connectors -->
  <path class="flow" d="M160 92 H200"/>
  <path class="flow" d="M340 92 H380"/>
  <path class="flow" d="M520 92 H560"/>
  <path class="flow" d="M700 92 H740"/>

  <!-- nodes -->
  <g>
    <rect class="node" x="20" y="60" width="140" height="64" rx="8"/>
    <text x="34" y="80" class="mono num">01</text>
    <text x="34" y="99" class="sans lbl">git push</text>
    <text x="34" y="115" class="sans sub">release branch</text>
  </g>
  <g>
    <rect class="node" x="200" y="60" width="140" height="64" rx="8"/>
    <text x="214" y="80" class="mono num">02</text>
    <text x="214" y="99" class="sans lbl">GitHub Actions</text>
    <text x="214" y="115" class="sans sub">workflow trigger</text>
  </g>
  <g>
    <rect class="node" x="380" y="60" width="140" height="64" rx="8"/>
    <text x="394" y="80" class="mono num">03</text>
    <text x="394" y="99" class="sans lbl">SSH to server</text>
    <text x="394" y="115" class="sans sub">fetch + reset</text>
  </g>
  <g>
    <rect class="node" x="560" y="60" width="140" height="64" rx="8"/>
    <text x="574" y="80" class="mono num">04</text>
    <text x="574" y="99" class="sans lbl">Docker Compose</text>
    <text x="574" y="115" class="sans sub">rebuild containers</text>
  </g>
  <g>
    <rect class="live" x="740" y="60" width="140" height="64" rx="8"/>
    <text x="754" y="80" class="mono num">05</text>
    <circle class="pulse" cx="862" cy="77" r="4"/>
    <text x="754" y="99" class="sans lbl">Health check</text>
    <text x="754" y="115" class="sans sub">then it's live</text>
  </g>

  <text x="20" y="164" class="sans cap">Production and development each deploy from their own branch to their own server, every push.</text>
</svg>
